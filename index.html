<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Fun</title>
<meta name="description" content="Lær engelsk med en lille mission hver dag. Saml point og løn dem ind hos mor og far.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="English Fun">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8F4FF; --surface:#FFFFFF; --surface2:#F3F8FF; --ink:#1E2B4F; --muted:#56638A; --line:#C6D8F0;
  --sky:#2F7FE8; --grape:#7350F0; --berry:#E8456F; --leaf:#1F9A60; --sun:#FFC93C; --fire:#FF7A1A;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111A31; --surface:#1B2647; --surface2:#16203D; --ink:#EEF2FF; --muted:#A9B4D4; --line:#2F3C66;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111A31; --surface:#1B2647; --surface2:#16203D; --ink:#EEF2FF; --muted:#A9B4D4; --line:#2F3C66;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-weight:600; font-size:17px; -webkit-tap-highlight-color:transparent;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
}
main{max-width:760px; margin:0 auto; padding:16px 16px 48px}
h1,h2,h3,.display{font-family:"Baloo 2",Nunito,system-ui,sans-serif; font-weight:800}
h2{font-size:clamp(1.8rem,6vw,2.4rem); line-height:1.05; margin:4px 0 4px}
h3{margin:0; font-size:1.3rem; line-height:1.1}
.sub{color:var(--muted); margin:0 0 16px; font-size:1.05rem}
button{font:inherit; color:inherit; cursor:pointer; border:0; background:none; touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:4px solid var(--sky); outline-offset:3px}
button:disabled{cursor:default}
input{font:inherit; color:var(--ink)}
kbd{font-family:Nunito,sans-serif; font-size:.75rem; font-weight:800; color:var(--muted); border:2px solid var(--line); border-radius:7px; padding:0 6px; position:absolute; top:8px; left:10px}

/* top bar */
.top{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:16px; min-height:46px}
.top .right{display:flex; gap:8px; align-items:center}
.pill-btn{background:var(--surface); border:2px solid var(--line); border-radius:999px; padding:9px 16px; font-weight:800}
.pill-btn:disabled{opacity:.4}
.chip{background:var(--surface); border:2px solid var(--line); border-radius:999px; padding:7px 13px; font-weight:800; white-space:nowrap}
.chip.coins{background:var(--sun); border-color:var(--sun); color:#1E2B4F}

/* home */
.hello{display:flex; align-items:center; gap:14px; margin:4px 0 16px}
.hello h1{font-size:clamp(2.2rem,8vw,3.2rem); line-height:1; margin:0}
.player{background:var(--surface); border:3px solid var(--line); border-radius:26px; padding:16px 18px; display:flex; gap:16px; align-items:center}
.lvl{flex:none; width:74px; height:74px; border-radius:50%; background:var(--grape); color:#fff; display:grid; place-items:center; text-align:center; line-height:1; box-shadow:0 5px 0 rgba(0,0,0,.2)}
.lvl small{display:block; font-size:.75rem; opacity:.9}
.lvl b{font-family:"Baloo 2",sans-serif; font-size:2rem}
.player .info{flex:1; min-width:0}
.xpbar{height:14px; background:var(--surface2); border:2px solid var(--line); border-radius:999px; overflow:hidden; margin:8px 0 4px}
.xpbar i{display:block; height:100%; background:linear-gradient(90deg,var(--grape),var(--sky)); border-radius:999px; transition:width .4s}
.xptext{color:var(--muted); font-size:.9rem}
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:12px}
.stat{background:var(--surface); border:3px solid var(--line); border-radius:20px; padding:10px 8px; text-align:center}
.stat b{display:block; font-family:"Baloo 2",sans-serif; font-size:1.7rem; line-height:1.1}
.stat small{color:var(--muted); font-size:.85rem}

.mission-btn{display:flex; width:100%; align-items:center; gap:16px; text-align:left; margin-top:16px; padding:20px 22px; border-radius:28px; color:#fff; background:linear-gradient(135deg,var(--leaf),#18b27a); box-shadow:0 7px 0 rgba(0,0,0,.22); transition:transform .08s, box-shadow .08s}
.mission-btn:active{transform:translateY(4px); box-shadow:0 3px 0 rgba(0,0,0,.22)}
.mission-btn .ic{font-size:3rem; line-height:1}
.mission-btn b{display:block; font-family:"Baloo 2",sans-serif; font-size:1.8rem; line-height:1.05}
.mission-btn small{display:block; font-size:1rem; opacity:.95}
.mission-btn.done{background:linear-gradient(135deg,#5a6b9a,#7a89b8)}

.tiles4{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px}
.tile-btn{background:var(--surface); border:3px solid var(--line); border-radius:22px; padding:14px; text-align:left; display:flex; gap:12px; align-items:center; box-shadow:0 5px 0 var(--line)}
.tile-btn:active{transform:translateY(3px); box-shadow:0 2px 0 var(--line)}
.tile-btn .ic{font-size:2.2rem; line-height:1}
.tile-btn b{display:block; font-family:"Baloo 2",sans-serif; font-size:1.3rem; line-height:1.05}
.tile-btn small{color:var(--muted); font-size:.9rem}
.foot{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:22px; color:var(--muted); font-size:.9rem; flex-wrap:wrap}
.linkish{color:var(--muted); text-decoration:underline; font-weight:800; padding:6px 2px}

/* mission path */
.path{display:grid; gap:12px; margin:8px 0 18px}
.step{display:flex; gap:14px; align-items:center; background:var(--surface); border:3px solid var(--line); border-radius:22px; padding:14px 16px}
.step .n{flex:none; width:48px; height:48px; border-radius:50%; display:grid; place-items:center; font-size:1.5rem; background:var(--surface2); border:3px solid var(--line)}
.step.now{border-color:var(--leaf); box-shadow:0 0 0 4px color-mix(in srgb,var(--leaf) 25%,transparent)}
.step.now .n{background:var(--leaf); border-color:var(--leaf); color:#fff}
.step.ok .n{background:var(--sun); border-color:var(--sun)}
.step.ok{opacity:.75}
.step small{color:var(--muted)}
.big-go{display:block; width:100%; background:var(--leaf); color:#fff; border-radius:999px; padding:18px; font-family:"Baloo 2",sans-serif; font-weight:800; font-size:1.6rem; box-shadow:0 6px 0 rgba(0,0,0,.2)}
.big-go:active{transform:translateY(3px); box-shadow:0 3px 0 rgba(0,0,0,.2)}
.big-go.alt{background:var(--sky)}

/* worlds */
.worlds{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px}
.world{position:relative; background:var(--surface); border:3px solid var(--line); border-radius:22px; padding:14px 10px 12px; text-align:center}
.world .ic{font-size:2.4rem; display:block; line-height:1.15}
.world b{display:block; font-family:"Baloo 2",sans-serif; font-size:1.2rem; line-height:1.1}
.world small{color:var(--muted); display:block}
.world .st{margin-top:6px; letter-spacing:1px; font-size:.95rem}
.world.locked{opacity:.55}
.world.locked .ic{filter:grayscale(1)}
.world .lock{position:absolute; top:8px; right:10px}
.world.next{border-color:var(--leaf)}
.stages{display:grid; gap:12px; margin:8px 0 16px}
.stage{display:flex; gap:14px; align-items:center; text-align:left; background:var(--surface); border:3px solid var(--line); border-radius:22px; padding:14px 16px; box-shadow:0 5px 0 var(--line)}
.stage:active:not(:disabled){transform:translateY(3px); box-shadow:0 2px 0 var(--line)}
.stage:disabled{opacity:.5; box-shadow:none}
.stage .ic{font-size:2.2rem}
.stage .grow{flex:1}
.stage .stars3{font-size:1.3rem; white-space:nowrap}
.wordlist{display:flex; flex-wrap:wrap; gap:8px}
.wl{background:var(--surface); border:2px solid var(--line); border-radius:999px; padding:5px 12px; font-size:.95rem}
.wl i{font-style:normal; margin-left:4px; color:var(--sun)}

/* round */
.rhead{display:flex; align-items:center; gap:10px; margin-bottom:14px}
.rhead .progress{flex:1; margin:0}
.progress{height:14px; background:var(--surface); border:2px solid var(--line); border-radius:999px; overflow:hidden}
.progress i{display:block; height:100%; background:var(--leaf); border-radius:999px; transition:width .3s}
.combo{font-weight:800; min-width:3.2em; text-align:center; color:var(--muted)}
.combo.on{color:var(--fire); transform:scale(1.15)}
.gain{font-weight:800; background:var(--sun); color:#1E2B4F; border-radius:999px; padding:4px 10px; white-space:nowrap}

.prompt{background:var(--surface); border:3px solid var(--line); border-radius:28px; padding:18px; text-align:center; margin-bottom:14px}
.pic{font-size:clamp(4rem,15vh,7rem); line-height:1.1}
.picTxt{display:inline-block; font-family:"Baloo 2",sans-serif; font-weight:800; font-size:.55em; background:var(--surface2); border:3px solid var(--line); border-radius:24px; padding:4px 24px; line-height:1.2}
.prompt .word{font-family:"Baloo 2",sans-serif; font-weight:800; font-size:clamp(2.2rem,9vw,3.2rem); line-height:1.05}
.prompt .da{color:var(--muted); font-size:1.2rem; margin-top:4px}
.prompt .sentence{font-family:"Baloo 2",sans-serif; font-weight:800; font-size:clamp(1.6rem,6vw,2.3rem); line-height:1.2; margin-top:6px}
.blank{display:inline-block; min-width:3em; border-bottom:5px solid var(--sky); color:var(--sky)}
.prompt .q{font-family:"Baloo 2",sans-serif; font-weight:800; font-size:clamp(1.8rem,7vw,2.6rem); line-height:1.15}

.speak{background:var(--sky); color:#fff; border-radius:999px; padding:12px 24px; font-weight:800; font-size:1.2rem; box-shadow:0 5px 0 rgba(0,0,0,.2); margin-top:10px}
.speak:active{transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.2)}
.speak.huge{font-size:1.6rem; padding:20px 34px}

.opts{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.opts.three{grid-template-columns:1fr}
@media (min-width:560px){ .opts.three{grid-template-columns:repeat(3,1fr)} }
.opt{position:relative; background:var(--surface); border:3px solid var(--line); border-radius:22px; min-height:86px; padding:12px; font-family:"Baloo 2",sans-serif; font-weight:800; font-size:1.6rem; line-height:1.1; box-shadow:0 5px 0 var(--line)}
.opt.emoji{font-size:3.2rem}
.opt.emoji .picTxt{font-size:1.4rem; border:0; background:none; padding:0}
.opt:active:not(:disabled){transform:translateY(3px); box-shadow:0 2px 0 var(--line)}
.opt.right{background:var(--leaf); border-color:var(--leaf); color:#fff; box-shadow:none}
.opt.right kbd,.opt.wrong kbd{color:#fff; border-color:rgba(255,255,255,.6)}
.opt.wrong{background:var(--berry); border-color:var(--berry); color:#fff; opacity:.7; box-shadow:none; animation:shake .35s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

.feedback{min-height:3.4em; text-align:center; font-size:1.25rem; font-weight:800; margin:14px 0 0}
.feedback.good{color:var(--leaf)}
.feedback.bad{color:var(--berry)}
.feedback small{display:block; color:var(--muted); font-weight:700; font-size:1rem}
.feedback .nextbtn{margin-top:8px}

.slots,.letters{display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin:12px 0}
.slot{width:50px; height:58px; border-radius:14px; border:3px dashed var(--line); display:grid; place-items:center; font-family:"Baloo 2",sans-serif; font-weight:800; font-size:1.9rem}
.slot.filled{border-style:solid; border-color:var(--sky); background:var(--surface)}
.slots.ok .slot{border-color:var(--leaf); background:var(--leaf); color:#fff}
.slots.no{animation:shake .35s}
.letter{width:54px; height:58px; border-radius:14px; background:var(--grape); color:#fff; font-family:"Baloo 2",sans-serif; font-weight:800; font-size:1.9rem; box-shadow:0 5px 0 rgba(0,0,0,.25)}
.letter:active{transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.25)}
.letter.used{visibility:hidden}
.row-btns{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:6px}

.typebox{display:flex; gap:10px; justify-content:center; flex-wrap:wrap}
.typebox input{width:min(100%,340px); font-family:"Baloo 2",sans-serif; font-weight:800; font-size:2rem; text-align:center; padding:10px 14px; border-radius:18px; border:3px solid var(--line); background:var(--surface)}
.typebox input.ok{border-color:var(--leaf); color:var(--leaf)}
.typebox input.no{border-color:var(--berry); animation:shake .35s}
.check{background:var(--leaf); color:#fff; border-radius:18px; padding:12px 22px; font-weight:800; font-size:1.3rem; box-shadow:0 5px 0 rgba(0,0,0,.2)}

.wslots{min-height:70px; display:flex; flex-wrap:wrap; gap:8px; justify-content:center; padding:10px; border:3px dashed var(--line); border-radius:20px; margin:10px 0}
.wslots.ok{border-color:var(--leaf); border-style:solid}
.wslots.no{border-color:var(--berry); animation:shake .35s}
.wtiles{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:8px 0}
.wt{background:var(--grape); color:#fff; border-radius:14px; padding:10px 16px; font-family:"Baloo 2",sans-serif; font-weight:800; font-size:1.5rem; box-shadow:0 5px 0 rgba(0,0,0,.25)}
.wt.placed{background:var(--sky)}
.wt.used{visibility:hidden}

.timer{height:18px; background:var(--surface); border:2px solid var(--line); border-radius:999px; overflow:hidden; flex:1}
.timer i{display:block; height:100%; background:var(--fire); border-radius:999px}
.speedcount{font-family:"Baloo 2",sans-serif; font-weight:800; font-size:1.6rem; min-width:2.5em; text-align:right}

/* results */
.end{text-align:center; padding-top:16px}
.end .bigstar{font-size:5.5rem; line-height:1}
.end .stars-big{font-size:3.2rem; letter-spacing:6px; margin:6px 0}
.end h2{font-size:clamp(2.2rem,8vw,3.2rem)}
.end .row{display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:22px}
.end .row button{font-size:1.2rem; padding:14px 22px}
.play{background:var(--leaf); color:#fff; border-radius:999px; font-weight:800; box-shadow:0 5px 0 rgba(0,0,0,.2)}
.summary{display:inline-grid; grid-template-columns:auto auto; gap:6px 18px; text-align:left; background:var(--surface); border:3px solid var(--line); border-radius:20px; padding:14px 20px; margin-top:10px}

/* shop */
.rewards{display:grid; gap:12px}
.reward{display:flex; align-items:center; gap:14px; background:var(--surface); border:3px solid var(--line); border-radius:22px; padding:14px 16px}
.reward .ic{font-size:2.2rem}
.reward .grow{flex:1; min-width:0}
.reward .progress{height:10px; margin-top:6px}
.reward .progress i{background:var(--sun)}
.reward button{flex:none}
.buy{background:var(--sun); color:#1E2B4F; border-radius:999px; padding:10px 16px; font-weight:800; box-shadow:0 4px 0 rgba(0,0,0,.2)}
.buy:disabled{background:var(--surface2); color:var(--muted); box-shadow:none}

/* badges */
.badges{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px}
.badge{background:var(--surface); border:3px solid var(--line); border-radius:22px; padding:14px 10px; text-align:center}
.badge .ic{font-size:2.6rem; display:block}
.badge b{display:block; font-family:"Baloo 2",sans-serif; font-size:1.1rem}
.badge small{color:var(--muted)}
.badge.off .ic{filter:grayscale(1); opacity:.35}
.badge.off b{color:var(--muted)}

/* parent */
.panel{background:var(--surface); border:3px solid var(--line); border-radius:22px; padding:16px; margin-bottom:14px}
.panel h3{margin-bottom:10px}
.kv{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px}
.kv div{background:var(--surface2); border-radius:14px; padding:10px}
.kv b{display:block; font-family:"Baloo 2",sans-serif; font-size:1.5rem}
.kv small{color:var(--muted)}
.bars{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; align-items:end; height:120px; margin-top:6px}
.bars .b{display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; font-size:.75rem; color:var(--muted)}
.bars .b i{display:block; width:70%; background:var(--sky); border-radius:6px 6px 0 0; min-height:2px}
.bars .b span{margin-top:4px}
.bars .b em{font-style:normal; font-weight:800; color:var(--ink)}
.field{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:6px 0}
.field input{padding:9px 12px; border-radius:12px; border:2px solid var(--line); background:var(--surface2); min-width:0}
.field input.name{flex:1 1 180px}
.field input.num{width:90px}
.btn{background:var(--sky); color:#fff; border-radius:12px; padding:9px 14px; font-weight:800}
.btn.ghost{background:var(--surface2); color:var(--ink); border:2px solid var(--line)}
.btn.danger{background:var(--berry)}
textarea{width:100%; min-height:90px; font:inherit; font-size:.8rem; padding:10px; border-radius:12px; border:2px solid var(--line); background:var(--surface2); color:var(--ink); word-break:break-all}
.loglist{display:grid; gap:6px; font-size:.95rem}
.loglist div{display:flex; justify-content:space-between; gap:10px; border-bottom:1px solid var(--line); padding:4px 0}
.note{color:var(--muted); font-size:.92rem}
.tabs{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px}
.tabs button{background:var(--surface); border:2px solid var(--line); border-radius:999px; padding:8px 14px; font-weight:800}
.tabs button.on{background:var(--ink); color:var(--bg); border-color:var(--ink)}

/* modal, toast, confetti */
.modal-bg{position:fixed; inset:0; background:rgba(10,15,35,.55); display:grid; place-items:center; padding:16px; z-index:50}
.modal{background:var(--surface); color:var(--ink); border-radius:26px; padding:22px; width:min(100%,420px); text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal .ic{font-size:3.5rem}
.modal .row{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:16px}
.modal input{font-family:"Baloo 2",sans-serif; font-size:1.8rem; text-align:center; letter-spacing:8px; width:200px; padding:8px; border-radius:14px; border:3px solid var(--line); background:var(--surface2); margin-top:8px}
.modal input.wide{letter-spacing:0; width:100%; font-size:1.4rem}
.toasts{position:fixed; left:50%; bottom:calc(16px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); display:grid; gap:8px; z-index:60; width:min(92vw,420px); pointer-events:none}
.toast{background:var(--ink); color:var(--bg); border-radius:18px; padding:12px 16px; font-weight:800; text-align:center; box-shadow:0 8px 24px rgba(0,0,0,.25); animation:pop .25s}
@keyframes pop{from{transform:translateY(12px); opacity:0}}
.float{position:fixed; z-index:55; font-family:"Baloo 2",sans-serif; font-weight:800; font-size:1.6rem; color:var(--leaf); pointer-events:none; animation:floatUp 1.1s forwards; text-shadow:0 2px 0 var(--surface)}
@keyframes floatUp{to{transform:translateY(-60px); opacity:0}}
.celebrate{position:fixed; inset:0; display:grid; place-items:center; z-index:58; background:rgba(10,15,35,.45); padding:16px}
.celebrate .card{background:var(--surface); border-radius:30px; padding:26px 30px; text-align:center; animation:pop .3s; max-width:420px}
.celebrate .ic{font-size:5rem; line-height:1}
#confetti{position:fixed; inset:0; pointer-events:none; z-index:70}
/* sig det højt */
.saybox{margin:12px auto 0; max-width:520px; background:var(--surface); border:3px solid var(--grape); border-radius:22px; padding:14px 16px; color:var(--ink)}
.saytxt{font-size:1.15rem; font-weight:800}
.saytxt b{font-family:"Baloo 2",sans-serif; font-size:1.5rem; color:var(--grape)}
.mic{display:inline-flex; align-items:center; gap:8px; margin-top:10px; background:var(--grape); color:#fff; border-radius:999px; padding:14px 26px; font-weight:800; font-size:1.25rem; box-shadow:0 5px 0 rgba(0,0,0,.22)}
.mic:disabled{opacity:.45}
.mic.listening{background:var(--berry); animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.saynote{min-height:1.3em; color:var(--muted); font-size:.98rem; margin-top:8px}
.saymsg{font-size:1.25rem; font-weight:800; color:var(--muted); margin-bottom:6px}
.saymsg.good{color:var(--leaf)}
.saybox .row-btns{margin-top:6px}
.opts.wait .opt{opacity:.45}
.sayhint{display:flex; gap:12px; align-items:center; margin-top:14px; background:color-mix(in srgb,var(--grape) 12%,var(--surface)); border:3px solid var(--grape); border-radius:22px; padding:12px 16px; font-weight:700}

const PRAISE = ["Great job!","Super!","Well done!","Fantastic!","You got it!","Awesome!","Brilliant!","Nice!"];

/* ================= HELPERS ================= */
const app = document.getElementById("app");
const $ = s => document.querySelector(s);
const rand = a => a[Math.floor(Math.random()*a.length)];
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
const esc = s => String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s).toLowerCase().replace(/[’`]/g,"'").replace(/\s+/g," ").trim();
const DAY = () => { const d=new Date(); return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/864e5); };
function lev(a,b){ const m=a.length,n=b.length; const d=Array.from({length:m+1},(_,i)=>[i]); for(let j=1;j<=n;j++) d[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++) d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return d[m][n]; }
const isTxtPic = p => /^[\p{L}\d]+$/u.test(p);
const pic = p => isTxtPic(p) ? `<span class="picTxt">${esc(p)}</span>` : p;

const ALLW = [], WMAP = {};
WORLDS.forEach((W,wi)=>{
  W.idx = wi;
  W.list = W.words.map(([en,da,p])=>{ const o={en,da,pic:p,W}; ALLW.push(o); WMAP[en]=o; return o; });
  W.sentences = W.sents.map(([en,da,blank,p,o])=>({en,da,blank,pic:p,o,W}));
});
const spellable = w => /^[a-z]+$/i.test(w.en) && w.en.length<=9;

/* ================= STATE ================= */
const KEY = "englishfun-v2";
function fresh(){ return {v:2, name:"", xp:0, pts:0, words:{}, stages:{}, streak:{n:0,last:-99}, days:{}, badges:{},
  log:[], rewards:DEFAULT_REWARDS.map(r=>({...r})), cap:0, pin:null, mission:null, best:{speed:0},
  stats:{math:0, combo:0, missions:0, said:0, sayAsk:0}, sound:true, mic:true, howto:false, speedDay:-1, backupAt:0, created:Date.now()}; }
let S = fresh();
try{
  const raw = localStorage.getItem(KEY);
  if(raw){ const o=JSON.parse(raw); S = Object.assign(fresh(), o); S.stats=Object.assign(fresh().stats, o.stats||{}); S.best=Object.assign(fresh().best,o.best||{}); }
  else {
    const old = parseInt(localStorage.getItem("ef-stars")||"0",10)||0;
    if(old>0){ S.pts=old; S.xp=old; S.log.push({t:Date.now(), type:"adj", n:old, note:"Stjerner fra den gamle udgave"}); }
  }
}catch(e){}
let storageOK = true;
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); storageOK=true; }catch(e){ storageOK=false; } }
/* v2.1: dagsloftet er fjernet som standard; giv point tilbage, der blev holdt tilbage af det gamle loft på 150 */
let refunded = 0;
if(!S.capFix){
  if(S.cap===150){
    S.cap=0;
    Object.values(S.days).forEach(d=>{ const m=Math.max(0,(d.xp||0)-(d.pts||0)); if(m){ refunded+=m; d.pts+=m; } });
    if(refunded){ S.pts+=refunded; S.log.unshift({t:Date.now(), type:"adj", n:refunded, note:"Point tilbage fra det gamle dagsloft"}); }
  }
  S.capFix=1; save();
}
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}

function dayRec(d){ d = d ?? DAY(); return S.days[d] || (S.days[d]={pts:0,xp:0,sec:0,n:0,ok:0}); }
const totalMin = () => Math.round(Object.values(S.days).reduce((a,d)=>a+(d.sec||0),0)/60);
const todayMin = () => Math.round((dayRec().sec||0)/60);

/* active time: count time between interactions, max 30 s per gap */
let lastAct = 0;
function tick(){
  const now=Date.now(), d=dayRec();
  if(lastAct){ const before=d.sec; d.sec += Math.min(now-lastAct,30000)/1000;
    if(before<600 && d.sec>=600) toast("⏱️ 10 minutter i dag – sejt! 💪"); }
  lastAct = now;
}

/* levels */
const lvlAt = L => 25*L*(L-1);
function lvlOf(x){ let L=1; while(x>=lvlAt(L+1)) L++; return L; }
const titleOf = L => TITLES[Math.min(L-1,TITLES.length-1)] + (L>TITLES.length ? " "+(L-TITLES.length+1) : "");

let capWarned = false;
function award(n){
  if(n<=0) return 0;
  const d=dayRec(), before=lvlOf(S.xp);
  S.xp += n; d.xp += n;
  const g = S.cap>0 ? Math.min(n, Math.max(0, S.cap - d.pts)) : n;
  S.pts += g; d.pts += g;
  if(g<n && !capWarned){ capWarned=true; toast("Du har nået dagens point-loft 🪙 Du får stadig XP!"); }
  const after=lvlOf(S.xp);
  save(); hudUpdate();
  if(after>before) setTimeout(()=>{ SFX.up(); confetti(); celebrate("🎖️","Level "+after+"!", titleOf(after)+" · +10 🪙"); award(10); }, 400);
  return g;
}

/* spaced repetition: box 0–5 */
const GAP = [0,1,2,4,7,14];
function introduce(en){ if(!S.words[en]) S.words[en]={b:0,due:DAY(),r:0,x:0}; }
function srs(en,q){
  if(!WMAP[en]) return; introduce(en); const r=S.words[en];
  if(q===2){ r.b=Math.min(5,r.b+1); r.r++; } else if(q===1){ r.r++; } else { r.b=Math.max(0,r.b-2); r.x++; }
  r.due = DAY() + (q===0 ? 0 : GAP[r.b]);
}
const mastered = () => Object.values(S.words).filter(r=>r.b>=4).length;
const wordBox = en => S.words[en] ? S.words[en].b : -1;

/* worlds/stages */
function stars(wi,s){ return (S.stages[WORLDS[wi].id]||[0,0,0])[s]||0; }
function setStars(wi,s,n){ const id=WORLDS[wi].id; const a=S.stages[id]||(S.stages[id]=[0,0,0]); a[s]=Math.max(a[s],n); }
function worldOpen(wi){ return wi<2 || stars(wi-1,0)>0; }
function stageOpen(wi,s){ return worldOpen(wi) && (s===0 || stars(wi,s-1)>0); }
function nextStage(){
  for(let wi=0;wi<WORLDS.length;wi++) for(let s=0;s<3;s++) if(stageOpen(wi,s) && !stars(wi,s)) return {wi,s};
  let best=null;
  WORLDS.forEach((W,wi)=>{ for(let s=0;s<3;s++){ const st=stars(wi,s); if(!best||st<best.st) best={wi,s,st}; } });
  return best;
}
const openWorlds = () => WORLDS.filter((W,wi)=>worldOpen(wi));

/* ================= SOUND & SPEECH ================= */
let AC=null;
function beep(seq){
  if(!S.sound) return;
  try{ AC = AC || new (window.AudioContext||window.webkitAudioContext)(); const t0=AC.currentTime+0.01;
    seq.forEach(([f,st,du,type])=>{ const o=AC.createOscillator(), g=AC.createGain(); o.type=type||"sine"; o.frequency.value=f;
      const vol = type==="square" ? 0.06 : 0.16;
      g.gain.setValueAtTime(0.0001,t0+st); g.gain.exponentialRampToValueAtTime(vol,t0+st+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t0+st+du);
      o.connect(g); g.connect(AC.destination); o.start(t0+st); o.stop(t0+st+du+0.05); });
  }catch(e){}
}
const SFX = {
  ok:()=>beep([[660,0,.12],[880,.09,.2]]),
  bad:()=>beep([[240,0,.22,"triangle"]]),
  combo:()=>beep([[523,0,.1],[659,.08,.1],[784,.16,.1],[1047,.24,.25]]),
  coin:()=>beep([[988,0,.08,"square"],[1319,.07,.22,"square"]]),
  up:()=>beep([[523,0,.15],[659,.12,.15],[784,.24,.15],[1047,.36,.4]]),
  tick:()=>beep([[1200,0,.05,"square"]])
};
let voice=null;
function findVoice(){ try{ const vs=speechSynthesis.getVoices();
  voice = vs.find(v=>/en-GB/i.test(v.lang)&&/Google/i.test(v.name)) || vs.find(v=>/en-GB/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || null; }catch(e){} }
if("speechSynthesis" in window){ findVoice(); speechSynthesis.onvoiceschanged=findVoice; }
function speak(text, rate, onend){
  let called=false; const end=()=>{ if(!called){ called=true; if(onend) onend(); } };
  try{ if(!("speechSynthesis" in window)){ setTimeout(end,600); return; } speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text); u.lang = voice ? voice.lang : "en-GB"; if(voice) u.voice=voice; u.rate = rate||0.85;
    u.onend=end; u.onerror=end; speechSynthesis.speak(u);
    if(onend) setTimeout(end, 900 + text.length*110);
  }catch(e){ setTimeout(end,600); }
}

/* tale-genkendelse (Chrome sender lyden til Googles tjeneste) */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let micDenied = false;
const micOn = () => !!SR && S.mic && !micDenied;
function normSay(t){ return norm(t).replace(/\d+/g,n=>+n<=100?numWord(+n):n).replace(/-/g," ").replace(/[^a-zæøå' ]/g," ").replace(/\s+/g," ").trim(); }
function sayMatch(heard, expected){
  const h=normSay(heard).split(" ").filter(Boolean), e=normSay(expected).split(" ").filter(Boolean);
  if(!h.length) return false;
  const close=(a,b)=>a===b || lev(a,b)<=Math.max(1,Math.round(b.length/3));
  if(e.length<=2) return close(h.join(" "),e.join(" ")) || e.every(w=>h.some(x=>close(x,w)));
  return e.filter(w=>h.some(x=>close(x,w))).length/e.length >= 0.6;
}
function listenFor(expected, cb){
  let done=false, r=null;
  const fin=(ok,heard)=>{ if(done) return; done=true; try{ r&&r.abort(); }catch(e){} cb(ok,heard); };
  try{
    r=new SR(); r.lang="en-GB"; r.interimResults=false; r.maxAlternatives=5; r.continuous=false;
    r.onresult=e=>{ const alts=[...e.results[0]].map(a=>a.transcript); fin(alts.some(a=>sayMatch(a,expected)), alts[0]||""); };
    r.onerror=e=>{ if(e.error==="not-allowed"||e.error==="service-not-allowed"||e.error==="audio-capture"){ micDenied=true; fin(null,""); } else fin(false,""); };
    r.onend=()=>fin(false,"");
    r.start();
  }catch(e){ micDenied=true; fin(null,""); }
  setTimeout(()=>fin(false,""), 8000);
  return ()=>{ done=true; try{ r&&r.abort(); }catch(e){} };
}

/* confetti */
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv=$("#confetti"), cx=cv.getContext("2d"); cv.width=innerWidth; cv.height=innerHeight;
  const cols=["#2F7FE8","#7350F0","#E8456F","#1F9A60","#FFC93C","#FF7A1A"];
  const P=Array.from({length:130},()=>({x:innerWidth/2+(Math.random()-.5)*200, y:innerHeight*0.35, vx:(Math.random()-.5)*14, vy:-Math.random()*14-4, s:6+Math.random()*7, c:rand(cols), r:Math.random()*6, vr:(Math.random()-.5)*.3}));
  let f=0; (function step(){ cx.clearRect(0,0,cv.width,cv.height);
    P.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.45; p.vx*=0.99; p.r+=p.vr; cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle=p.c; cx.fillRect(-p.s/2,-p.s/3,p.s,p.s*0.6); cx.restore(); });
    if(++f<120) requestAnimationFrame(step); else cx.clearRect(0,0,cv.width,cv.height); })();
}

/* ================= ITEMS ================= */
function seenPool(){ return ALLW.filter(w=>S.words[w.en]); }
function poolFor(w){ return w.W.list.length>=4 ? w.W.list : ALLW; }
function pickOpts(correct, pool, n, key){
  const out=[correct];
  for(const o of shuffle(pool)){ if(out.length>=n) break; if(!out.some(y=>y[key]===o[key] || norm(y.en)===norm(o.en))) out.push(o); }
  if(out.length<n) for(const o of shuffle(ALLW)){ if(out.length>=n) break; if(!out.some(y=>y[key]===o[key])) out.push(o); }
  return shuffle(out);
}
function itemForBox(w){
  const b=Math.max(0,wordBox(w.en));
  if(b<=1) return {t:Math.random()<.5?"pic2word":"listen2pic", w};
  if(b===2) return {t:"listen2word", w};
  if(b===3) return {t:spellable(w)?"spell":"type", w};
  return {t:"type", w};
}
function reviewItems(){
  const d=DAY();
  let due=ALLW.filter(w=>S.words[w.en] && S.words[w.en].due<=d).sort((a,b)=>S.words[a.en].b-S.words[b.en].b);
  due = shuffle(due.slice(0,10)).slice(0,6);
  if(due.length<6){
    const extra=shuffle(seenPool().filter(w=>!due.includes(w))).sort((a,b)=>S.words[a.en].b-S.words[b.en].b).slice(0,6-due.length);
    due=due.concat(extra);
  }
  return due.map(itemForBox);
}
function hardItems(){
  return seenPool().filter(w=>S.words[w.en].x>0).sort((a,b)=>(S.words[b.en].x/(S.words[b.en].r+1))-(S.words[a.en].x/(S.words[a.en].r+1))).slice(0,8).map(itemForBox);
}
function stageItems(wi,s){
  const W=WORLDS[wi], ws=shuffle(W.list).slice(0,8);
  if(s===0) return ws.map((w,i)=>({t:i%2?"pic2word":"listen2pic", w}));
  if(s===1) return ws.map((w,i)=>({t: i%2===0 && spellable(w) ? "spell" : "listen2word", w}));
  const sents=shuffle(W.sentences); const out=[];
  const types=["type","fill","type","build","type","fill","type","build"];
  let wi2=0, si=0;
  types.forEach(t=>{ if(t==="type"||si>=sents.length) out.push({t:"type", w:ws[wi2++ % ws.length]}); else out.push({t, s:sents[si++]}); });
  return out;
}

/* round runner */
function runRound(cfg){
  const items=cfg.items, R={i:0, perfect:0, combo:0, best:0, earned:0};
  if(!items.length) return cfg.onDone ? cfg.onDone(R) : go(home);
  lastAct=Date.now();
  const api={
    frame(inner){
      app.innerHTML = `<div class="rhead"><button class="pill-btn" id="quit" aria-label="Stop">✕</button>
        <div class="progress"><i style="width:${R.i/items.length*100}%"></i></div>
        <span class="combo ${R.combo>=3?"on":""}">🔥${R.combo}</span><span class="gain">+${R.earned} 🪙</span></div>` + inner;
      $("#quit").onclick=()=>confirmBox("Vil du stoppe? Dine point er gemt, men banen tæller ikke.","Stop",()=>go(home));
    },
    answer(q, en){
      tick(); const d=dayRec(); d.n++; if(q===2) d.ok++;
      if(en) srs(en,q);
      let p = q===2 ? cfg.per : q===1 ? 1 : 0;
      R.lastQ=q;
      if(q===2) R.perfect++; else R.combo=0;
      if(cfg.kind==="math" && q===2) S.stats.math++;
      const g=award(p); R.earned+=g; api.hud();
      if(g>0) floatMsg("+"+g+" 🪙", app.querySelector(".prompt"));
      return g;
    },
    hud(){
      const c=app.querySelector(".combo"); if(c){ c.textContent="🔥"+R.combo; c.classList.toggle("on",R.combo>=3); }
      const gn=app.querySelector(".gain"); if(gn) gn.textContent=`+${R.earned} 🪙`;
    },
    penalty(){
      if(S.pts>0){ S.pts--; const d=dayRec(); d.guess=(d.guess||0)+1; R.earned=Math.max(0,R.earned-1); save(); hudUpdate(); api.hud(); return 1; }
      return 0;
    },
    /* efter rigtigt svar: sig ordet/sætningen højt. Det giver lige så mange point som selve svaret. */
    sayStep(text){
      const fb=$("#fb"), bonus=cfg.per; let tries=0, finished=false, stop=null;
      const d=dayRec(); d.sayAsk=(d.sayAsk||0)+1; S.stats.sayAsk++;
      const box=document.createElement("div"); box.className="saybox"; fb.appendChild(box);
      const nx=()=>{ if(stop) stop(); R.i++; go(next); };
      const finish=(pts,msg,ok)=>{
        finished=true; if(stop) stop();
        if(ok){ d.said=(d.said||0)+1; S.stats.said++;
          if(R.lastQ===2){ R.combo++; R.best=Math.max(R.best,R.combo); if(R.combo>(S.stats.combo||0)) S.stats.combo=R.combo;
            if(R.combo%5===0){ pts+=5; const c=R.combo; setTimeout(()=>{ SFX.combo(); toast(`🔥 ${c} i træk! +5 bonus`); },250); } } }
        const g=award(pts); R.earned+=g; api.hud();
        box.innerHTML=`<div class="saymsg ${ok?"good":""}">${msg}${g?` +${g} 🪙`:""}</div><button class="play nextbtn" style="padding:12px 24px" id="nx">Næste ▶</button>`;
        $("#nx").onclick=nx; box.scrollIntoView({block:"nearest", behavior:"smooth"});
        KEYH=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); nx(); } };
      };
      const render=note=>{
        const mic=micOn();
        box.innerHTML=`<div class="saytxt">🗣️ Sig det højt: <b>${esc(text)}</b></div>
          <button class="mic" id="mic" ${mic?"":"disabled"}>${mic?"🎤 Tryk – og sig det":"🗣️ Jeg har sagt det højt"}</button>
          <div class="saynote" id="sn">${note||""}</div>
          <div class="row-btns"><button class="pill-btn" id="again">🔊 Hør igen</button><button class="linkish" id="skip">Spring over (ingen point)</button></div>`;
        $("#again").onclick=()=>speak(text, text.includes(" ")?0.75:0.8);
        $("#skip").onclick=()=>{ R.combo=0; nx(); };
        const btn=$("#mic");
        if(mic){
          btn.onclick=()=>{ if(finished||btn.classList.contains("listening")) return;
            try{ speechSynthesis.cancel(); }catch(e){}
            btn.classList.add("listening"); btn.textContent="🎙️ Jeg lytter … sig det nu"; $("#sn").textContent="";
            stop=listenFor(text,(ok,heard)=>{ if(finished) return; stop=null;
              if(ok===null) return render("Mikrofonen virker ikke her – brug knappen, når du har sagt det højt.");
              if(ok){ SFX.ok(); return finish(bonus,"🌟 Perfekt sagt!",true); }
              tries++;
              if(tries>=3) return finish(1,"💪 Godt forsøg! Det bliver lettere, jo mere du øver.",false);
              SFX.bad(); render(heard?`Jeg hørte “${esc(heard)}”. Prøv igen – tal tydeligt 🙂`:"Jeg hørte ikke noget. Tryk og sig det lidt højere."); });
          };
        } else {
          setTimeout(()=>{ if(!finished && btn.isConnected) btn.disabled=false; }, 1500);
          btn.onclick=()=>finish(Math.ceil(bonus/2),"👍 Godt!",true);
        }
        KEYH=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); if(!btn.disabled) btn.click(); } };
        box.scrollIntoView({block:"nearest", behavior:"smooth"});
      };
      render();
    }
  };
  function next(){
    if(R.i>=items.length){ save(); return cfg.onDone(R); }
    const it=items[R.i]; ITEM[it.t](it, api);
  }
  next();
}

function mc(api, o){
  let first=true;
  api.frame(o.top + `<div class="opts ${o.three?"three":""}">${o.options.map((x,n)=>`<button class="opt ${o.emoji?"emoji":""}" data-n="${n}" aria-label="${esc(o.aria?o.aria(x):o.label(x))}"><kbd>${n+1}</kbd>${o.label(x)}</button>`).join("")}</div><p class="feedback" id="fb"></p>`);
  const btns=[...app.querySelectorAll(".opt")], fb=$("#fb"), grid=app.querySelector(".opts");
  const wrongs=new Set(); let t0=0, isReady=false, solved=false;
  const ready=()=>{ if(isReady||solved||!grid.isConnected) return; isReady=true; t0=Date.now(); grid.classList.remove("wait"); btns.forEach((b,n)=>{ if(!wrongs.has(n)) b.disabled=false; }); };
  grid.classList.add("wait"); btns.forEach(b=>b.disabled=true);
  if(o.onShow) o.onShow();
  if(o.audio){ speak(o.audio, null, ()=>setTimeout(ready,250)); setTimeout(ready,3500); } else setTimeout(ready, o.readMs||900);
  const pick=n=>{
    const b=btns[n]; if(!b||b.disabled||!isReady) return; const x=o.options[n];
    if(o.isRight(x)){
      solved=true; btns.forEach(y=>y.disabled=true); b.classList.add("right"); SFX.ok();
      api.answer(first?2:0, o.en);
      fb.className="feedback good"; fb.innerHTML=`${rand(PRAISE)} ${o.right?`<small>${o.right()}</small>`:""}`;
      if(o.say) o.say();
      KEYH=null; api.sayStep(o.sayText);
    } else {
      const fast = Date.now()-t0 < 1500;
      first=false; wrongs.add(n); b.classList.add("wrong"); SFX.bad();
      const lost = fast ? api.penalty() : 0;
      fb.className="feedback bad";
      fb.innerHTML = lost ? `🐢 For hurtigt gættet: −1 🪙 <small>${o.wrong?o.wrong(x)+" · ":""}Lyt og læs først – så går det bedre</small>`
                          : `Prøv igen! ${o.wrong?`<small>${o.wrong(x)}</small>`:"<small>Det klarer du!</small>"}`;
      if(o.onWrong) o.onWrong();
      isReady=false; grid.classList.add("wait"); btns.forEach(y=>y.disabled=true);
      setTimeout(ready, 1600);
    }
  };
  btns.forEach((b,n)=>b.onclick=()=>pick(n));
  KEYH=e=>{ const k=parseInt(e.key,10); if(k>=1&&k<=o.options.length) pick(k-1); };
}

/* numbers & math */
const ONES=["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
const TENS=["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
function numWord(n){ if(n<20) return ONES[n]; if(n===100) return "one hundred"; const t=Math.floor(n/10),o=n%10; return TENS[t]+(o?"-"+ONES[o]:""); }
function mathItem(){
  const lv = S.stats.math<15 ? 1 : S.stats.math<40 ? 2 : 3;
  let a,b,op,ans;
  const r=Math.random();
  if(lv===1){ op = r<.6?"+":"-"; a=2+Math.floor(Math.random()*12); b=1+Math.floor(Math.random()*8); }
  else if(lv===2){ op = r<.4?"+":r<.7?"-":"×"; if(op==="×"){ a=2+Math.floor(Math.random()*4); b=2+Math.floor(Math.random()*9);} else { a=10+Math.floor(Math.random()*50); b=3+Math.floor(Math.random()*30);} }
  else { op = r<.3?"+":r<.55?"-":"×"; if(op==="×"){ a=3+Math.floor(Math.random()*8); b=3+Math.floor(Math.random()*8);} else { a=20+Math.floor(Math.random()*60); b=5+Math.floor(Math.random()*35);} }
  if(op==="-" && b>a) [a,b]=[b,a];
  ans = op==="+"?a+b : op==="-"?a-b : a*b;
  if(ans>100){ op="-"; ans=a-b; if(ans<0){ [a,b]=[b,a]; ans=a-b; } }
  const opw = op==="+"?"plus":op==="-"?"minus":"times";
  const cand=new Set([ans]);
  const near=[ans+1,ans-1,ans+10,ans-10,ans+2];
  if(ans>=13&&ans<=19) near.unshift((ans-10)*10); // thirteen ↔ thirty
  if(ans>=30&&ans<=90&&ans%10===0) near.unshift(ans/10+10);
  for(const x of shuffle(near.slice(0,3)).concat(near.slice(3))){ if(cand.size>=4) break; if(x>=0&&x<=100) cand.add(x); }
  while(cand.size<4) cand.add(Math.max(0,ans+Math.floor(Math.random()*20)-10));
  return {t:"math", m:{words:Math.random()<.5, qWords:`${numWord(a)} ${opw} ${numWord(b)}`, qDigits:`${a} ${op} ${b}`, ans, opts:shuffle([...cand])}};
}

/* ================= STAGES ================= */
function startStage(wi,s,fromMission){
  const W=WORLDS[wi];
  const fresh=W.list.filter(w=>!S.words[w.en]);
  if(s===0 && fresh.length) return learnCards(W, fresh, ()=>go(()=>startStage(wi,s,fromMission)), true);
  const old=stars(wi,s);
  runRound({title:W.en, items:stageItems(wi,s), per: old===3 ? Math.ceil(STAGES[s].per/2) : STAGES[s].per, onDone:R=>{
    const total=8, ratio=R.perfect/total;
    const st = ratio>=.85?3 : ratio>=.6?2 : ratio>=.4?1 : 0;
    setStars(wi,s,st);
    let bonus=0;
    if(st>old){ bonus=(st-old)*5; award(bonus); }
    const unlocked = s===0 && old===0 && st>0 && wi+1<WORLDS.length && wi+1>=2 ? WORLDS[wi+1] : null;
    if(st>0){ SFX.up(); confetti(); }
    save(); checkBadges();
    const nextFn = fromMission ? missionNext : ()=>worldScreen(wi);
    const lines=[["Rigtige i første forsøg",`${R.perfect} / ${total}`],["Point",`+${R.earned+bonus} 🪙`]];
    if(R.best>=3) lines.push(["Bedste combo",`🔥 ${R.best}`]);
    showResult({ic: st===3?"🏆":st>0?"⭐":"💪", stars:st,
      title: st===3?"Perfect!":st===2?"Great work!":st===1?"Good job!":"Almost!",
      sub: (st===0?"Du skal have mindst 4 rigtige i første forsøg for at klare banen. Prøv igen – du lærer hver gang! ":"")
        +(unlocked?`🔓 Ny verden låst op: ${unlocked.ic} ${unlocked.en}!`:"")
        +(bonus?` (+${bonus} 🪙 for nye stjerner)`:""),
      lines,
      buttons: fromMission ? [["Fortsæt missionen ▶", nextFn, true]] : [["🔁 Prøv igen",()=>startStage(wi,s,false)],["Videre ▶",nextFn,true]]});
  }});
}
function showResult(o){
  app.innerHTML = topBar(null) + `<div class="end">
    <div class="bigstar" aria-hidden="true">${o.ic}</div>
    ${o.stars!==undefined?`<div class="stars-big" aria-label="${o.stars} stjerner">${"★".repeat(o.stars)}<span style="opacity:.25">${"★".repeat(3-o.stars)}</span></div>`:""}
    <h2>${esc(o.title)}</h2>
    ${o.sub?`<p class="sub">${esc(o.sub)}</p>`:""}
    ${o.lines?`<div class="summary">${o.lines.map(([k,v])=>`<span>${esc(k)}</span><b>${esc(v)}</b>`).join("")}</div>`:""}

function learnCards(W, list, after, isIntro){
  let i=0, flipped=false, nextOk=false; const saidOk=[];
  function draw(){
    const w=list[i];
    app.innerHTML = topBar(isIntro?null:"Tilbage") + `<h2>${W.ic} ${isIntro?"Nye ord!":W.en}</h2>
      <p class="sub">${isIntro?"Lyt og sig ordet højt. Derefter starter banen.":"Lyt og sig ordet højt."}</p>
      <button class="prompt" id="card" style="width:100%" aria-label="Vis dansk">
        <div class="pic" aria-hidden="true">${pic(w.pic)}</div><div class="word">${esc(w.en)}</div>
        ${flipped?`<div class="da">🇩🇰 ${esc(w.da)}</div>`:`<div class="sub" style="margin:6px 0 0">Tryk for at se det på dansk</div>`}
      </button>
      <div style="text-align:center"><button class="speak" id="say">🔊 Listen</button>
        ${micOn()?`<button class="mic" id="cmic" style="margin-left:8px">${saidOk[i]?"✅ Godt sagt!":"🎤 Sig det"}</button>`:""}
        <div class="saynote" id="cn">${saidOk[i]?"":"🗣️ Sig ordet højt, før du går videre"}</div></div>
      <div class="top" style="margin-top:16px">
        <button class="pill-btn" id="prev" ${i===0?"disabled":""}>◀</button>
        <span class="xptext">${i+1} / ${list.length}</span>
        <button class="pill-btn" id="next">${i===list.length-1?(isIntro?"Start banen ▶":"Færdig ✓"):"Næste ▶"}</button></div>`;
    if(!isIntro) bindBack(after);
    $("#card").onclick=()=>{ flipped=!flipped; draw(); };
    $("#say").onclick=()=>speak(w.en);
    const cm=$("#cmic");
    if(cm) cm.onclick=()=>{ if(cm.classList.contains("listening")) return; try{speechSynthesis.cancel();}catch(e){}
      cm.classList.add("listening"); cm.textContent="🎙️ Jeg lytter …";
      listenFor(w.en,(ok,heard)=>{ if(list[i]!==w) return;
        if(ok){ saidOk[i]=true; SFX.ok(); }
        draw();
        const c=$("#cn"); if(!ok && c) c.textContent = ok===null ? "Mikrofonen virker ikke her – sig det bare højt" : heard ? `Jeg hørte “${heard}”. Prøv igen 🙂` : "Jeg hørte ikke noget – prøv igen"; }); };
    const nb=$("#next"); if(!nextOk){ nb.disabled=true; setTimeout(()=>{ nextOk=true; if(nb.isConnected) nb.disabled=false; },1400); }
    const show=k=>{ i=k; flipped=false; nextOk=false; draw(); speak(list[i].en); };
    const prev=()=>{ if(i>0) show(i-1); };
    const next=()=>{ if(!nextOk) return; introduce(w.en); tick();
      if(i<list.length-1){ show(i+1); }
      else { list.forEach(x=>introduce(x.en)); save(); if(isIntro) award(list.length); after(); } };
    $("#prev").onclick=prev; $("#next").onclick=next;
    KEYH=e=>{ if(e.key==="ArrowRight"||e.key==="Enter") next(); else if(e.key==="ArrowLeft") prev(); else if(e.key===" "){ e.preventDefault(); flipped=!flipped; draw(); } };
  }
  draw(); speak(list[0].en);
}

function speedRound(onEnd){
  let pool=seenPool(); if(pool.length<6) pool=openWorlds().flatMap(W=>W.list);
  const LEN=60000; let end=Date.now()+LEN, n=0, done=false, cur=null, opts=[];
  lastAct=Date.now();
  app.innerHTML = `<div class="rhead"><button class="pill-btn" id="quit">✕</button><div class="timer"><i id="tbar" style="width:100%"></i></div><span class="speedcount" id="cnt">0</span></div>
    <div class="prompt"><div class="pic" id="spic"></div></div><div class="opts" id="sopts"></div>
    <p class="note" style="text-align:center;margin-top:14px">Tryk 1 eller 2 – eller ← →. Forkert svar koster 3 sekunder.</p>`;
  $("#quit").onclick=()=>{ done=true; go(home); };
  function nextQ(){
    cur=rand(pool); const other=rand(pool.filter(x=>x.en!==cur.en && x.pic!==cur.pic)); opts=shuffle([cur,other]);
    $("#spic").innerHTML=pic(cur.pic);
    $("#sopts").innerHTML=opts.map((o,i)=>`<button class="opt" data-n="${i}"><kbd>${i+1}</kbd>${esc(o.en)}</button>`).join("");
    app.querySelectorAll("#sopts .opt").forEach(b=>b.onclick=()=>pick(+b.dataset.n));
  }
  function pick(i){ if(done) return; tick();
    if(opts[i].en===cur.en){ n++; SFX.ok(); $("#cnt").textContent=n; nextQ(); }
    else { SFX.bad(); end-=3000; const b=app.querySelectorAll("#sopts .opt")[i]; b.classList.add("wrong"); b.disabled=true; } }
  KEYH=e=>{ if(e.key==="1"||e.key==="ArrowLeft") pick(0); else if(e.key==="2"||e.key==="ArrowRight") pick(1); };
  nextQ();
  INTERVAL=setInterval(()=>{
    const left=end-Date.now(); const bar=$("#tbar"); if(bar) bar.style.width=Math.max(0,left/LEN*100)+"%";
    if(left<=0 && !done){ done=true; clearInterval(INTERVAL); KEYH=null; tick();
      const record = n>S.best.speed; if(record) S.best.speed=n;
      const firstToday = S.speedDay!==DAY(); S.speedDay=DAY();
      const earned=award((firstToday?Math.ceil(n/2):0) + (record?5:0)); if(record){ confetti(); SFX.up(); } save(); checkBadges();
      onEnd({n, earned, record}); }
  },100);
}

/* ================= PARENTS ================= */
async function hashPin(pin){
  const txt="englishfun:"+pin;
  try{ const buf=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt)); return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join(""); }
  catch(e){ let h=5381; for(const c of txt) h=((h<<5)+h+c.charCodeAt(0))>>>0; return "d"+h.toString(16); }
}
function parentGate(onOk, why){
  if(!S.pin){
    return modal(`<div class="ic">👪</div><h3>Lav en forældrekode</h3><p class="note">${why?why+"<br>":""}Vælg en kode på 4 cifre. Den skal bruges, når point skal løses ind.</p>
      <input id="p1" inputmode="numeric" maxlength="4" type="password" autocomplete="off" placeholder="····"><br><input id="p2" inputmode="numeric" maxlength="4" type="password" autocomplete="off" placeholder="gentag">
      <p class="feedback bad" id="pe" style="min-height:1.4em;font-size:1rem"></p><div class="row"><button class="pill-btn" data-c>Annullér</button><button class="play" style="padding:10px 20px" data-o>Gem kode</button></div>`,
      (m,close)=>{ m.querySelector("[data-c]").onclick=close;
        const ok=async()=>{ const a=m.querySelector("#p1").value, b=m.querySelector("#p2").value;
          if(!/^\d{4}$/.test(a)) return m.querySelector("#pe").textContent="Koden skal være 4 cifre";
          if(a!==b) return m.querySelector("#pe").textContent="Koderne er ikke ens";
          S.pin=await hashPin(a); save(); close(); onOk(); };
        m.querySelector("[data-o]").onclick=ok; m.querySelector("#p2").onkeydown=e=>{ if(e.key==="Enter") ok(); }; });
  }
  modal(`<div class="ic">🔐</div><h3>Mor eller far</h3><p class="note">${why||"Skriv forældrekoden"}</p>
    <input id="p1" inputmode="numeric" maxlength="4" type="password" autocomplete="off" placeholder="····">
    <p class="feedback bad" id="pe" style="min-height:1.4em;font-size:1rem"></p><div class="row"><button class="pill-btn" data-c>Annullér</button><button class="play" style="padding:10px 20px" data-o>OK</button></div>`,
    (m,close)=>{ m.querySelector("[data-c]").onclick=close; const inp=m.querySelector("#p1");
      const ok=async()=>{ if(await hashPin(inp.value)===S.pin){ close(); onOk(); } else { m.querySelector("#pe").textContent="Forkert kode"; inp.value=""; inp.focus(); } };
      m.querySelector("[data-o]").onclick=ok; inp.onkeydown=e=>{ if(e.key==="Enter") ok(); }; });
}

      <div class="panel"><h3>Indlæs backup</h3><p class="note">Indsæt en gemmekode, eller vælg en backup-fil. Det erstatter alt på denne computer.</p>
      <textarea id="imp" placeholder="EF2:…"></textarea><div class="field"><input type="file" id="file" accept=".txt,text/plain"><button class="btn" id="doImp">Indlæs</button></div></div>
      <div class="panel"><h3>Andet</h3><div class="field"><button class="btn ghost" id="newPin">Skift forældrekode</button><button class="btn ghost" id="rename">Skift navn</button><button class="btn danger" id="reset">Nulstil alt</button></div></div>`;
  }
  app.innerHTML = topBar("Hjem") + `<h2>👪 Mor og far</h2><p class="sub">Overblik, belønninger og backup.</p>
    <div class="tabs">${tabs.map(([k,l])=>`<button class="${ptab===k?"on":""}" data-t="${k}">${l}</button>`).join("")}</div>${body}`;
  bindBack(home);
  app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{ ptab=b.dataset.t; parent(); });
  if(ptab==="rewards"){
    const collect=()=>{ app.querySelectorAll("#rw input").forEach(inp=>{ const r=S.rewards[+inp.dataset.i]; if(!r) return; const f=inp.dataset.f; r[f]= f==="cost" ? Math.max(1,parseInt(inp.value,10)||1) : inp.value.trim(); }); };
    app.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{ collect(); S.rewards.splice(+b.dataset.del,1); save(); parent(); });
    $("#add").onclick=()=>{ collect(); S.rewards.push({ic:"🎁",name:"Ny belønning",cost:50}); save(); parent(); };
    $("#saveR").onclick=()=>{ collect(); S.rewards=S.rewards.filter(r=>r.name); save(); toast("Gemt ✓"); parent(); };
  }
  if(ptab==="points"){
    $("#micT").onchange=e=>{ S.mic=e.target.checked; micDenied=false; save(); toast(S.mic?"Mikrofon slået til 🎤":"Mikrofon slået fra"); };
    $("#saveCap").onclick=()=>{ S.cap=Math.max(0,parseInt($("#cap").value,10)||0); save(); toast("Gemt ✓"); };
    $("#doAdj").onclick=()=>{ const n=parseInt($("#adj").value,10); if(!n) return; S.pts=Math.max(0,S.pts+n); if(n>0) S.xp+=n;
      S.log.unshift({t:Date.now(), type:"adj", n, note:$("#adjn").value.trim()||"Justering"}); save(); toast(`${n>0?"+":""}${n} 🪙`); parent(); };
  }
  if(ptab==="backup"){
    const code=makeCode(); $("#code").value=code;
    const mark=()=>{ S.backupAt=Date.now(); save(); };
    $("#cp").onclick=async()=>{ try{ await navigator.clipboard.writeText(code); toast("Kopieret ✓"); }catch(e){ $("#code").select(); toast("Markeret – tryk Ctrl+C"); } mark(); };
    $("#dl").onclick=()=>{ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([code],{type:"text/plain"}));
      a.download=`english-fun-backup-${new Date().toISOString().slice(0,10)}.txt`; document.body.appendChild(a); a.click(); a.remove(); mark(); toast("Downloadet ✓"); };
    $("#file").onchange=async e=>{ const f=e.target.files[0]; if(f) $("#imp").value=(await f.text()).trim(); };
    $("#doImp").onclick=async()=>{ const o=await readCode($("#imp").value.trim()); if(!o) return toast("⚠️ Koden er ugyldig");
      confirmBox(`Erstat alt med backup (${esc(o.name)}, ${o.pts} 🪙, level ${lvlOf(o.xp)})?`,"Indlæs",()=>{ S=Object.assign(fresh(),o); save(); toast("Backup indlæst ✓"); go(home); }); };
    $("#newPin").onclick=()=>{ S.pin=null; parentGate(()=>toast("Ny kode gemt ✓")); };
    $("#rename").onclick=()=>modal(`<h3>Navn</h3><input class="wide" id="nm" maxlength="20" value="${esc(S.name)}"><div class="row"><button class="play" style="padding:10px 20px" data-o>Gem</button></div>`,
      (m,close)=>{ m.querySelector("[data-o]").onclick=()=>{ const v=m.querySelector("#nm").value.trim(); if(v){ S.name=v; save(); } close(); }; });
    $("#reset").onclick=()=>modal(`<h3>Nulstil alt?</h3><p class="note">Alle point, ord og stjerner slettes. Skriv NULSTIL for at bekræfte.</p><input class="wide" id="rs"><div class="row"><button class="btn danger" data-o>Nulstil</button></div>`,
      (m,close)=>{ m.querySelector("[data-o]").onclick=()=>{ if(m.querySelector("#rs").value.trim().toUpperCase()==="NULSTIL"){ S=fresh(); save(); close(); go(home); } }; });
  }
}
function sum32(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619)>>>0; } return h.toString(36); }
function makeCode(){ const j=JSON.stringify(S); const b=btoa(unescape(encodeURIComponent(j))); return "EF2:"+b+":"+sum32("ef2"+j); }
async function readCode(c){
  try{ const m=c.match(/^EF2:([A-Za-z0-9+/=]+):([a-z0-9]+)$/); if(!m) return null;
    const j=decodeURIComponent(escape(atob(m[1]))); if(sum32("ef2"+j)!==m[2]) return null;
    const o=JSON.parse(j); return o&&o.v===2 ? o : null; }catch(e){ return null; }
}

/* ================= START ================= */
document.addEventListener("visibilitychange",()=>{ if(document.hidden){ save(); lastAct=0; } });
home();
if(refunded) setTimeout(()=>{ SFX.coin(); confetti(); celebrate("🪙",`+${refunded} point!`,"Du har fået de point tilbage, som loftet holdt tilbage."); hudUpdate(); }, 500);
</script>
